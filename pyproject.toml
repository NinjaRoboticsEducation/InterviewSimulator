[project]
name = "interview-simulator"
version = "0.1.0"
description = "Private, evidence-grounded local interview practice"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[db]==2.10.0",
  "sqlalchemy[asyncio]>=2,<3",
  "litellm>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1,<2",
  "opencc-python-reimplemented>=0.1.7,<1",
  "interviewwiki>=0.2.1",
  "httpx>=0.27,<1",
  "openai>=2,<3",
  "filelock>=3,<5",
  "markdown-it-py>=3,<5",
  "nh3>=0.3,<1",
  "keyring>=25,<26",
  "jsonschema>=4.23,<5",
]

[project.scripts]
interview-simulator = "interview_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_simulator"]

[tool.uv.sources]
interviewwiki = {path = "InterviewWiki", editable = true}

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["model: requires a live local language model", "hardware: requires physical microphone or voice services"]

[tool.ruff]
line-length = 110
extend-exclude = ["InterviewWiki"]

[[tool.mypy.overrides]]
module = ["interviewwiki.*", "opencc.*", "jsonschema.*"]
ignore_missing_imports = true
