[project]
name = "interviewwiki"
version = "0.2.1"
description = "Portable, evidence-grounded job interview preparation workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "pyyaml>=6,<7",
]

[project.scripts]
interviewwiki = "interviewwiki.cli:main"
interviewwiki-mcp = "interviewwiki.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interviewwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = ["pytest>=8.3,<9"]
