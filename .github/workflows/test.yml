name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked project
        run: uv sync --locked --all-extras
      - name: Run tests
        run: uv run --locked pytest
      - name: Lint and format
        run: |
          uv run --locked ruff check src agents tests scripts
          uv run --locked ruff format --check src agents tests scripts
      - name: Type checks
        run: uv run --locked mypy src/interview_simulator --follow-imports=silent --check-untyped-defs
      - name: Browser logic
        run: |
          node tests/browser_state.cjs
          node tests/browser_voice.cjs
